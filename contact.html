<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Mood Board</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="moodboard-page">

    <div class="moodboard-layout">

        <aside class="moodboard-sidebar">
            <h1>Mood<br>Board.</h1>

            <p>
                A collection of seasons and their moods, that continue to inspire me.             </p>

            <nav class="moodboard-nav">
                <a href="index.html">Home</a>
                <a href="contact.html" aria-current="page">Mood Board</a>
            </nav>
        </aside>

        <main class="aesthetic-grid" aria-label="Aesthetic inspiration">

            <figure class="aesthetic-card">
                <img src="images/f.png"
                     alt="This is a fall aesthetic as the leaves change color">
                <figcaption>Fall</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/fall.png"
                     alt="Scotland aethetic and fall environment">
                <figcaption>Has</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/a.png"
                     alt="spring colors and vibe">
                <figcaption>Fallen</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/ll.png"
                     alt="fall">
                <figcaption>Moodboard</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/win.png"
                     alt="winter">
                <figcaption>Winter</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/ter.png"
                     alt="Winter">
                <figcaption>Is</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/co.png"
                     alt="Winter">
                <figcaption>Comming</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/mming.png"
                     alt="winter">
                <figcaption>Moodboard</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/sp.png"
                     alt="A classic tone to spring">
                <figcaption>Spring</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/rin.png"
                     alt="spring has sprung designs">
                <figcaption>Has</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/pred.png"
                     alt="Romatic spring">
                <figcaption>Sprung</figcaption>
            </figure>

            <figure class="aesthetic-card">
                <img src="images/pride2.png"
                     alt="spring time">
                <figcaption>Moodboard</figcaption>
            </figure>

        </main>

    </div>

</body>
</html>
